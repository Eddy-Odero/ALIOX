<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/loader.css?v=2">
</head>
<body>

<main class="load" aria-live="polite">
  <!-- the loader robot: a simple line drawing, so it shows instantly -->
  <svg class="bot" viewBox="-60 -62 120 112" role="img" aria-label="Loading" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <line x1="0" y1="-46" x2="0" y2="-34"/>
    <circle class="ant" cx="0" cy="-50" r="4" fill="currentColor" stroke="none"/>
    <path d="M-34 -30H34Q42 -30 42 -22V22Q42 30 34 30H-34Q-42 30 -42 22V-22Q-42 -30 -34 -30Z"/>
    <rect x="-30" y="-14" width="60" height="22" rx="8" opacity=".55"/>
    <g class="eyes" fill="currentColor" stroke="none"><circle cx="-13" cy="-3" r="4"/><circle cx="13" cy="-3" r="4"/></g>
    <line x1="-12" y1="20" x2="12" y2="20" opacity=".5"/>
    <line x1="-42" y1="-4" x2="-48" y2="-4"/><line x1="42" y1="-4" x2="48" y2="-4"/>
  </svg>

  <div class="bar" aria-hidden="true"><i id="fill"></i></div>

  <p class="txt" id="txt">LOADING <span id="pct">0</span>%</p>

  <button class="enter" id="enter" type="button" data-href="home.html" aria-label="Click to enter" disabled>CLICK <small>TO ENTER</small></button>
</main>

<script src="js/loader.js?v=1"></script>
</body>
</html>
